name = "ino-cloud-coding-agent"
main = "src/index.ts"
compatibility_date = "2026-08-13"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "CodingSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CodingSession"]
